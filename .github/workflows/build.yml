name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./gd-mod

      - name: Upload the built .geode
        uses: actions/upload-artifact@v4
        with:
          name: bio-run-tracker-windows
          path: |
            ${{ github.workspace }}/**/*.geode
          if-no-files-found: error
